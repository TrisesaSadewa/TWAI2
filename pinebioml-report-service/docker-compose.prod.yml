services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pinebioml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pinebioml_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pinebioml} -d $${POSTGRES_DB:-pinebioml_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 20

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling production Ollama models..."
        ollama pull deepseek-r1:14b
        ollama pull qwen2.5-coder:14b
        ollama pull nomic-embed-text
        echo "Available models:"
        ollama list
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: pinebioml-report-service/Dockerfile
    restart: unless-stopped
    command: uvicorn core.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PUBLIC_PORT:-8001}:8000"
    volumes:
      - app_storage:/app/storage
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pinebioml}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-pinebioml_db}
      SERVICE_API_KEY: ${SERVICE_API_KEY:?SERVICE_API_KEY is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      STORAGE_DIR: /app/storage
      MEDIA_ROOT: /app/storage/media
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-r1:14b}
      WRITER_DEPLOYMENT: ${WRITER_DEPLOYMENT:-cpu}
      CPU_DEPLOYMENT_WRITER_MODEL: ${CPU_DEPLOYMENT_WRITER_MODEL:-deepseek-r1:14b}
      VERIFIER_MODEL: ${VERIFIER_MODEL:-qwen2.5-coder:14b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      VISION_MODEL: ${VISION_MODEL:-glm-ocr:latest}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-900}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - default
      - shared_network

volumes:
  postgres_data:
  ollama_data:
  app_storage:

networks:
  shared_network:
    external: true
    name: pinebioml-shared-network
