<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generating Report...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style nonce="{{ request.state.csp_nonce }}">
        :root {
            --bg-main: #0B0F19;
            --text-main: #E2E8F0;
            --accent-primary: #38BDF8;
            --accent-secondary: #818CF8;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader-container {
            max-width: 500px;
            width: 100%;
            padding: 3rem 2rem;
            background: rgba(17, 24, 39, 0.75);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
            font-size: 2.5rem;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(56, 189, 248, 0.1);
            border-top: 4px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2.5rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-msg {
            font-size: 1.15rem;
            color: var(--text-main);
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 9999px;
            margin-top: 2rem;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            width: 0%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 9999px;
        }
    </style>
</head>
<body>
    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <h1>PineBioML</h1>
        <div class="status-msg" id="status-text">Initializing pipeline...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div id="live-preview" style="margin-top: 2rem; text-align: left; background: rgba(0,0,0,0.5); padding: 1rem; border-radius: 0.5rem; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; color: #a1a1aa; display: none;"></div>
    </div>

    <script nonce="{{ request.state.csp_nonce }}">
        const reportId = "{{ REPORT_ID }}";
        const token = "{{ TOKEN }}";
        let finished = false;
        let fallbackTimer = null;

        // --- Status UI helpers ---
        function handleStatusUpdate(data) {
            if (finished) return;

            document.getElementById("status-text").innerText = data.message || "Processing...";
            document.getElementById("progress-fill").style.width = `${data.progress_pct || 0}%`;

            if (data.status === "SUCCESS") {
                finished = true;
                document.getElementById("status-text").innerText = "Complete! Seamlessly loading report...";
                document.getElementById("progress-fill").style.width = "100%";
                setTimeout(() => {
                    window.location.replace(`/report/${reportId}/html?token=${token}&direct=true`);
                }, 800);
            } else if (data.status === "FAILED") {
                finished = true;
                document.getElementById("status-text").innerText = "Error: " + (data.message || "Pipeline failed");
                document.getElementById("status-text").style.color = "#ef4444";
                document.querySelector(".spinner").style.display = "none";
                document.getElementById("progress-fill").style.background = "#ef4444";
            }
        }

        // --- Single initial fetch to hydrate (catches already-done jobs) ---
        fetch(`/report/status/${reportId}?token=${token}`)
            .then(res => res.ok ? res.json() : Promise.reject(res.status))
            .then(data => handleStatusUpdate(data))
            .catch(err => console.warn("Initial status fetch failed:", err));

        // --- SSE: primary real-time channel ---
        const evtSource = new EventSource(`/report/stream/${reportId}?token=${token}`);
        const livePreview = document.getElementById('live-preview');
        let sseConnected = false;

        let inString = false;
        let escapeNext = false;

        evtSource.onmessage = function(event) {
            if (event.data === "[DONE]") {
                evtSource.close();
                return;
            }
            try {
                const payload = JSON.parse(event.data);
                if (payload.connected) {
                    sseConnected = true;
                    // SSE is working — cancel fallback polling if active
                    if (fallbackTimer) { clearInterval(fallbackTimer); fallbackTimer = null; }
                    livePreview.style.display = "block";
                    return;
                }

                // Route by event type
                if (payload.type === "status") {
                    handleStatusUpdate(payload);
                    return;
                }

                // Narrative content (type === "narrative" or legacy format)
                const content = payload.content || "";
                if (content) {
                    let newlyTyped = "";
                    for (let i = 0; i < content.length; i++) {
                        let char = content[i];
                        if (escapeNext) {
                            newlyTyped += char;
                            escapeNext = false;
                        } else if (char === '\\') {
                            escapeNext = true;
                        } else if (char === '"') {
                            inString = !inString;
                            if (!inString) newlyTyped += "<br><br>";
                        } else if (inString) {
                            newlyTyped += char;
                        }
                    }
                    if (newlyTyped) {
                        const node = document.createTextNode(newlyTyped.replace(/<br>/g, "\n"));
                        livePreview.appendChild(node);
                        livePreview.scrollTop = livePreview.scrollHeight;
                    }
                }
            } catch (e) {}
        };

        // --- Fallback: low-frequency polling if SSE fails to connect ---
        evtSource.onerror = function() {
            if (finished) { evtSource.close(); return; }
            // If SSE never connected, start fallback polling at 10s
            if (!sseConnected && !fallbackTimer) {
                console.warn("SSE connection failed — falling back to polling (10s)");
                fallbackTimer = setInterval(() => {
                    if (finished) { clearInterval(fallbackTimer); return; }
                    fetch(`/report/status/${reportId}?token=${token}`)
                        .then(res => res.ok ? res.json() : null)
                        .then(data => { if (data) handleStatusUpdate(data); })
                        .catch(() => {});
                }, 10000);
            }
        };
    </script>
</body>
</html>
