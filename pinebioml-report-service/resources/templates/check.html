    <script nonce="{{ request.state.csp_nonce }}">
        // 切換下拉選單的顯示與隱藏
        document.getElementById('dropdown-button').addEventListener('click', function(event) {
            event.preventDefault();
            document.querySelector('.custom-dropdown').classList.toggle('show');
        });

        // 遍歷每個選項，點擊後更新按鈕的文字，並隱藏下拉選單
        document.querySelectorAll('.custom-option').forEach(item => {
            item.addEventListener('click', function(event) {
                document.getElementById('dropdown-button').innerText = item.innerText;
                document.getElementById('target-column-hidden').value = item.getAttribute('data-value');
                document.querySelector('.custom-dropdown').classList.remove('show');
                document.getElementById('dropdown-container').classList.remove('error-border'); // 移除紅框
            });
        });

        // 點擊其他區域時隱藏下拉選單
        document.addEventListener('click', function(event) {
            var isClickInside = document.querySelector('.custom-dropdown').contains(event.target);
            if (!isClickInside) {
                document.querySelector('.custom-dropdown').classList.remove('show');
            }
        });

        // 搜索框過濾選項
        document.getElementById('dropdown-search').addEventListener('input', function() {
            let filter = this.value.toLowerCase();
            let options = document.querySelectorAll('.custom-option');
            options.forEach(function(option) {
                let text = option.innerText.toLowerCase();
                if (text.includes(filter)) {
                    option.style.display = "";
                } else {
                    option.style.display = "none";
                }
            });
        });

        // 表單驗證
        function validateForm() {
            const targetColumn = document.getElementById('target-column-hidden').value;
            if (!targetColumn) {
                // 沒有選擇 Target Column，顯示紅框並滾動到選擇目標的地方
                document.getElementById('dropdown-container').classList.add('error-border');
                document.getElementById('dropdown-container').scrollIntoView({ behavior: 'smooth', block: 'center' });
                return false; // 阻止表單提交
            }
            else{
                showLoadingForForm(event);
            }

            return true;
        }


        document.addEventListener('DOMContentLoaded', function() {
            const sidebarContainer = document.getElementById('sidebar-container');
            const fileNameElement = document.getElementById('file-name-display');
            let fileName = fileNameElement.textContent.trim(); // 取得文件名稱
            

            if (fileName !== 'No file selected.') {
                const maxLength = 70; // 設置最大長度
                if (fileName.length > maxLength) {
                    const dotIndex = fileName.lastIndexOf('.');
                    if (dotIndex !== -1) {
                        const name = fileName.slice(0, dotIndex); // 檔案名（不包括副檔名）
                        const extension = fileName.slice(dotIndex); // 副檔名

                        // 截斷檔名，確保總長度不超過 maxLength
                        const truncatedName = name.slice(0, maxLength - extension.length - 3) + '...' + extension;
                        fileNameElement.textContent = "Selected file: " + truncatedName;
                    } else {
                        // 沒有副檔名的情況，簡單截斷
                        fileNameElement.textContent = "Selected file: " + fileName.slice(0, maxLength) + '...';
                    }
                } else {
                    // 文件名不超過最大長度
                    fileNameElement.textContent = "Selected file: " + fileName;
                }
            }
        });
        function showLoadingForForm(event) {
			const loading = document.getElementById('loading');
			loading.style.display = 'flex';
			const preloader = document.querySelector('.preloader');
			preloader.classList.remove('preloader-deactivate');
        }
        document.addEventListener('DOMContentLoaded', function () {
            // 綁定所有按鈕和超連結
            const elements = document.querySelectorAll('button, a'); // 選取按鈕和超連結
            elements.forEach(element => {
                element.addEventListener('click', function (event) {
                    // 如果元素具有 'no-preloader' class，則跳過
                    if (event.currentTarget.classList.contains('no-preloader')) {
                        return; // 不顯示 preloader，直接返回
                    }

                    // 顯示 preloader
                    showLoadingForForm(event);

                    // 如果是超連結，防止預設行為並延遲跳轉
                    if (element.tagName === 'A' && element.href) {
                        event.preventDefault(); // 阻止默認跳轉
                        setTimeout(() => {
                            window.location.href = element.href; // 延遲後跳轉
                        }, 300); // 根據需要調整延遲時間
                    }
                });
            });

            // 綁定所有表單提交事件並在提交前更新 CSRF token
            const forms = document.querySelectorAll('form');
            forms.forEach(form => {
                form.addEventListener('submit', async function (event) {
                    // 如果已經在處理提交中，直接返回
                    if (form.dataset.isSubmitting) return;
                    
                    // 暫停預設提交，等我們更新完 token 後再手動提交
                    event.preventDefault();
                    form.dataset.isSubmitting = "true";

                    // 顯示 preloader
                    if (!form.classList.contains('no-preloader')) {
                        showLoadingForForm(event);
                    }

                    try {
                        // 獲取新的 CSRF token
                        const response = await fetch('/api/csrf-token');
                        if (response.ok) {
                            const data = await response.json();
                            // 更新 form 內的 hidden inputs
                            const csrfInputs = form.querySelectorAll('input[name="csrf_token"], input[name="csrfmiddlewaretoken"]');
                            csrfInputs.forEach(input => {
                                input.value = data.csrf_token;
                            });
                        }
                    } catch (err) {
                        console.error("Failed to refresh CSRF token", err);
                    }

                    // 手動提交表單 (這會繞過 submit event listener)
                    form.submit();
                });
            });
        });
    </script>
<script nonce="{{ request.state.csp_nonce }}">
    (function () {
        function adjustSidebar() {
            var headerInner = document.querySelector('.header-inner');
            var sidebar = document.querySelector('.sidebar');
            if (headerInner && sidebar) {
                sidebar.style.top = headerInner.offsetHeight + 'px';
            }
        }
        document.addEventListener('DOMContentLoaded', adjustSidebar);
        window.addEventListener('resize', adjustSidebar);

        var progressBar = document.getElementById('scroll-progress-bar');
        function updateProgress() {
            var scrollTop = window.scrollY || document.documentElement.scrollTop;
            var docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            var pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
            if (progressBar) progressBar.style.height = pct + '%';
        }
        window.addEventListener('scroll', updateProgress, { passive: true });
        document.addEventListener('DOMContentLoaded', updateProgress);
    })();
</script>
</body>
</html>
